version: '3.8'

services:
  # Infrastructure Services
  redis:
    image: redis:7-alpine
    container_name: hft-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - hft-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: hft-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_SERVERS: "zookeeper:2888:3888"
      # Clean up ephemeral nodes on restart
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_MAX_CLIENT_CNXNS: 0
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - hft-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: hft-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      # HFT Performance Optimizations
      KAFKA_NUM_NETWORK_THREADS: 8
      KAFKA_NUM_IO_THREADS: 8
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 102400
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 102400
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 104857600
      # Auto-create HFT topics
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 6
      # Broker restart configuration
      KAFKA_DELETE_TOPIC_ENABLE: 'true'
      KAFKA_CONFLUENT_SUPPORT_METRICS_ENABLE: 'false'
      # Session timeout settings
      KAFKA_ZOOKEEPER_SESSION_TIMEOUT_MS: 18000
      KAFKA_ZOOKEEPER_CONNECTION_TIMEOUT_MS: 18000
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - hft-network

  # Application Services
  angel-one-api:
    build:
      context: .
      dockerfile: Dockerfile.angel-one
    container_name: hft-angel-one
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    volumes:
      - ./server/src/angel_one_api:/app/angel_one_api
      - ./server/src/core:/app/core
      - ./server/src/caching_service:/app/caching_service
    networks:
      - hft-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  risk-service:
    build:
      context: .
      dockerfile: Dockerfile.risk-service
    container_name: hft-risk-service
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      angel-one-api:
        condition: service_healthy
    ports:
      - "8003:8003"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - ANGEL_ONE_API_URL=http://angel-one-api:8000
      - RISK_API_PORT=8003
      - RISK_API_HOST=0.0.0.0
    volumes:
      - ./server/src/risk_service:/app/risk_service
      - ./server/src/core:/app/core
      - ./server/src/caching_service:/app/caching_service
      - ./server/src/messaging_enhanced:/app/messaging_enhanced
    networks:
      - hft-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  caching-service:
    build:
      context: .
      dockerfile: Dockerfile.caching-service
    container_name: hft-caching-service
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8001:8001"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./server/src/caching_service:/app/caching_service
    networks:
      - hft-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  messaging-service:
    build:
      context: .
      dockerfile: Dockerfile.messaging-service
    container_name: hft-messaging-service
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8002:8002"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./server/src/messaging_enhanced:/app/messaging_enhanced
      - ./server/src/caching_service:/app/caching_service
    networks:
      - hft-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Strategy Engine Service
  strategy-engine:
    build:
      context: .
      dockerfile: Dockerfile.strategy-engine
    container_name: hft-strategy-engine
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      angel-one-api:
        condition: service_healthy
      risk-service:
        condition: service_healthy
      messaging-service:
        condition: service_healthy
    ports:
      - "8004:8004"
    env_file:
      - .env
    environment:
      - ANGEL_ONE_API_URL=http://angel-one-api:8000
      - RISK_SERVICE_URL=http://risk-service:8003
      - CACHING_SERVICE_URL=http://caching-service:8001
      - MESSAGING_SERVICE_URL=http://messaging-service:8002
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STRATEGY_ENGINE_ENV=production
      - PYTHONPATH=/app
    volumes:
      - ./server/src/strategy_engine:/app/strategy_engine
      - ./server/src/core:/app/core
      - ./server/src/caching_service:/app/caching_service
      - ./server/src/messaging_enhanced:/app/messaging_enhanced
      - ./config/strategy_config.json:/app/config/strategy_config.json
      - ./logs/strategy_engine:/app/logs
    networks:
      - hft-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8004/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Monitoring & Observability (Optional)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: hft-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: hft-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - hft-network
    profiles:
      - monitoring

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: hft-redis-ui
    depends_on:
      - redis
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: redis:redis:6379
    networks:
      - hft-network
    profiles:
      - monitoring

volumes:
  redis_data:
  kafka_data:
  zookeeper_data:
  zookeeper_logs:

networks:
  hft-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

